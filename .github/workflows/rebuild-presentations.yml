name: Rebuild presentation PDFs

on:
  push:
    branches:
      - feat/presentation-explanations

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python sim.py
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation.tex
          latexmk_use_lualatex: true
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation-long.tex
          working_directory: extra
          latexmk_use_lualatex: true
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation.pdf extra/presentation-long.pdf extra/figures/welfare-accuracy.pdf extra/figures/welfare-accuracy.png
          git rm .github/workflows/rebuild-presentations.yml
          git commit -m "docs: rebuild clarified presentation PDFs"
          git push
